# Publishes the container image to ghcr.io/datum-labs/compute-network-demo.
#
# This does not use the shared datum-cloud publish workflow, because that one
# attaches build provenance. Attestations turn the pushed artifact into an OCI
# image index, and the Datum runtime that pulls this image selects a plain
# Docker manifest. So the build here explicitly disables provenance, SBOM and
# OCI media types.
#
# For the same reason the image is built for linux/amd64 only: a multi-platform
# push is a manifest list by definition, and there is no arm64 instance type to
# run it on. The Dockerfile itself is architecture-neutral, so building another
# platform by hand works if that ever changes.
name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/datum-labs/compute-network-demo

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every build gets an immutable tag naming the commit it came from. The
      # default branch also gets `main`, which moves; release tags also get the
      # version, which does not.
      - name: Work out the tags
        id: tags
        run: |
          set -euo pipefail
          tags="--tag ${IMAGE}:sha-${GITHUB_SHA::12}"
          case "${GITHUB_REF}" in
            refs/heads/main)
              tags="$tags --tag ${IMAGE}:main" ;;
            refs/tags/v*)
              version="${GITHUB_REF#refs/tags/}"
              tags="$tags --tag ${IMAGE}:${version} --tag ${IMAGE}:latest" ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "$tags"

      - name: Build and push
        run: |
          set -euo pipefail
          # oci-mediatypes is an exporter option, not a build flag, so the
          # push goes through --output rather than --push.
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false --sbom=false \
            ${{ steps.tags.outputs.tags }} \
            --output type=image,push=true,oci-mediatypes=false .

      - name: Report the digest
        run: |
          docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA::12}" \
            --format '{{println .Manifest.MediaType}}{{println .Manifest.Digest}}'
