name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: datum-cloud/actions/.github/workflows/ci-basic.yaml@v1.26.0
    with:
      run: |
        go vet ./...
        npm ci --no-audit --no-fund --prefix web
        npm run build --prefix web
