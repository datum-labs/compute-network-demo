# Example only — do not commit a real key.
#
# Create the Secret from the key file you downloaded instead, so the private
# key never passes through a file in a repository:
#
#   kubectl --kubeconfig ./project.kubeconfig create secret generic global-mesh-credentials \
#     --from-file=credentials.json=./global-mesh-key.json
#
# The file is the service-account key JSON exactly as downloaded. The demo reads
# it the same way `datumctl login --credentials` does.
apiVersion: v1
kind: Secret
metadata:
  name: global-mesh-credentials
  namespace: default
type: Opaque
stringData:
  credentials.json: |
    {
      "type": "datum_service_account",
      "client_id": "<CLIENT-ID>",
      "client_email": "<CLIENT-EMAIL>",
      "private_key_id": "<PRIVATE-KEY-ID>",
      "private_key": "-----BEGIN RSA PRIVATE KEY-----\n...\n-----END RSA PRIVATE KEY-----\n",
      "scope": "<SCOPE-FROM-DOWNLOADED-FILE>"
    }
