# Identity the demo uses in live mode.
#
# In live mode each Instance asks the Datum Cloud API which other Instances of
# its own workload exist, and where they are. It authenticates as this service
# account, using a key mounted from the Secret in
# 20-credentials-secret.example.yaml.
#
# Apply to the PROJECT control plane:
#   datumctl auth update-kubeconfig --kubeconfig ./project.kubeconfig --project <PROJECT>
#   kubectl --kubeconfig ./project.kubeconfig apply -f live/00-serviceaccount.yaml
#
# A key's private half is returned only in the response that creates it and is
# never stored again. Create the key on its own and write that one response
# straight to a file; ServiceAccountKey is cluster-scoped (no namespace) and
# kubectl's client-side schema check does not know it, so pass --validate=false:
#   kubectl create --validate=false -f <key manifest> \
#     -o jsonpath='{.status.privateKey}' > ./global-mesh-key.json
# status.privateKey is already the complete credentials JSON the demo reads;
# nothing needs to be wrapped around it. Creating the key from the portal or
# datumctl and downloading the JSON gives the same file.
apiVersion: iam.miloapis.com/v1alpha1
kind: ServiceAccount
metadata:
  name: global-mesh
  annotations:
    kubernetes.io/description: Lets the demo's Instances discover their peers.
spec:
  state: Active
---
apiVersion: identity.miloapis.com/v1alpha1
kind: ServiceAccountKey
metadata:
  name: global-mesh
spec:
  # FILL IN: the service account's user name, which the control plane assigns
  # once the ServiceAccount above exists:
  #   kubectl get serviceaccounts.iam.miloapis.com global-mesh \
  #     -o jsonpath='{.status.email}'
  serviceAccountUserName: <SERVICE-ACCOUNT-USER-NAME>
